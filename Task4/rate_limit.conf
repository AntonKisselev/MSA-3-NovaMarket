http {
    limit_req_zone $binary_remote_addr zone=web:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=mobile:10m rate=30r/s;

    map $http_user_agent $client_type {
        default "web";
        ~*(android|iphone|ipad|mobile) "mobile";
    }

    server {
        listen 80;

        location /api/ {
            # Определяем какой лимит применять
            if ($client_type = "mobile") {
                limit_req zone=mobile;
                break;
            }

            if ($client_type = "web") {
                limit_req zone=web;
                break;
            }

            # Fallback на веб лимит
            limit_req zone=web;

            proxy_pass http://backend;
            proxy_set_header X-Client-Type $client_type;
        }
    }
}