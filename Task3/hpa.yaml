apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: novamarket-hpa
  labels:
    app: novamarket
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: novamarket-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80