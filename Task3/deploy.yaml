apiVersion: apps/v1
kind: Deployment
metadata:
  name: novamarket-deployment
  labels:
    app: novamarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novamarket
  template:
    metadata:
      labels:
        app: novamarket
    spec:
      containers:
        - name: novamarket
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "10Mi"
            limits:
              memory: "30Mi"
      restartPolicy: Always
      